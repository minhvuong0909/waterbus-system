# CI cho Smart Waterbus: build + test Backend, build Frontend, build Docker image.
# Chạy trên mọi PR vào main và mỗi lần push lên main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waterbus-be
    services:
      # SQL Server thật cho DomainPersistenceTests (các test này tự tạo/xoá DB WaterbusDomainTests_*)
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Test_Passw0rd!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Test_Passw0rd!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
      # 3 Redis độc lập cho RedisCommercialTests (TTL của checkout cache và khoá RedLock giữa nhiều node)
      redis1:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      redis2:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      redis3:
        image: redis:7-alpine
        ports: ["6381:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      WATERBUS_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci_Test_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      WATERBUS_TEST_REDIS: "localhost:6379;localhost:6380;localhost:6381"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: waterbus-be/**/*.csproj

      - name: Restore
        run: dotnet restore WaterbusSystem.sln

      - name: Build
        run: dotnet build WaterbusSystem.sln --no-restore -c Release

      # ScannerAssignmentMigrationSqlTests cần 2-3 database đã migrate THẬT bằng code của một
      # điểm lịch sử CỐ ĐỊNH trên main (không phải "migrate tới 1 ID cũ bằng assembly nhánh này")
      # để kiểm tra đường nâng cấp lên migration mới của nhánh này là đúng 100% với schema main
      # thực tế đang chạy. Dùng SHA cố định bb1bf0c (main ngay sau PR #59 AddEmailOutbox, ngay
      # trước PR #58) thay vì origin/main - origin/main là ref DI ĐỘNG: khi PR #58 đã merge vào
      # main, origin/main không còn đại diện cho "trước PR #58" nữa, làm sai lệch baseline và từng
      # khiến CI đỏ (hotfix fix/scanner-assignment-migration-test-pinned-baseline). SHA lịch sử cố
      # định không bao giờ đổi nên baseline luôn đúng ý nghĩa dù main tiến lên bao nhiêu commit sau.
      # checkout mặc định chỉ fetch 1 commit nên phải fetch riêng SHA đó, rồi dùng git worktree
      # + dotnet-ef build/migrate TỪ CHÍNH code tại SHA đó (không load chung assembly vào process
      # test để tránh xung đột nạp 2 bản cùng tên WaterbusSystem.Infrastructure.dll). Dùng FULL SHA
      # (không viết tắt 7 ký tự) cho lệnh fetch - GitHub từ chối "couldn't find remote ref" với SHA
      # viết tắt vì object chưa có trong repo local để git tự giải nghĩa; git worktree add thì chấp
      # nhận cả 2 dạng sau khi đã fetch, nhưng giữ full SHA xuyên suốt cho nhất quán.
      - name: Fetch pinned main baseline commit for migration-baseline test
        run: git fetch origin bb1bf0c2f39cf0b2ee77e099d0afae6e4ec6ab26 --depth=1

      - name: Build migration baseline databases from the pinned main commit's real code
        working-directory: .
        run: |
          set -e
          dotnet tool install --global dotnet-ef --version 8.0.10
          export PATH="$PATH:$HOME/.dotnet/tools"
          MAIN_BASELINE_SHA="bb1bf0c2f39cf0b2ee77e099d0afae6e4ec6ab26"
          git worktree add --detach /tmp/waterbus-main "$MAIN_BASELINE_SHA"
          CONN_BASE="Server=localhost,1433;User Id=sa;Password=Ci_Test_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true"
          BASELINE_MIGRATION="20261012003336_AddBoatPositionEventIndex"
          (cd /tmp/waterbus-main/waterbus-be && dotnet ef database update "$BASELINE_MIGRATION" \
            --project src/WaterbusSystem.Infrastructure --startup-project src/WaterbusSystem.WebApi \
            --connection "$CONN_BASE;Initial Catalog=WaterbusDomainTests_MainBaselineValid")
          (cd /tmp/waterbus-main/waterbus-be && dotnet ef database update "$BASELINE_MIGRATION" \
            --project src/WaterbusSystem.Infrastructure --startup-project src/WaterbusSystem.WebApi \
            --connection "$CONN_BASE;Initial Catalog=WaterbusDomainTests_MainBaselineDuplicate")
          # Xác nhận đường nâng cấp khi DB đã chạy TOÀN BỘ migration của main tại SHA cố định này
          # (bao gồm AddEmailOutbox của PR #59, tức migration PR #58 đầu tiên - timestamp 031430 -
          # sẽ bị áp SAU EmailOutbox về mặt thời gian thật dù ID nhỏ hơn) - không chỉ từ mốc trước cả
          # 2 PR. Target migration truyền EXPLICIT (AddEmailOutbox) - không bỏ trống để "migrate tới
          # latest", vì "latest của SHA này" chỉ đúng tình cờ tại bb1bf0c; nếu baseline SHA sau này
          # đổi sang 1 SHA mới hơn, "latest" có thể âm thầm trỏ sang migration khác mà không ai hay.
          (cd /tmp/waterbus-main/waterbus-be && dotnet ef database update "20261106042025_AddEmailOutbox" \
            --project src/WaterbusSystem.Infrastructure --startup-project src/WaterbusSystem.WebApi \
            --connection "$CONN_BASE;Initial Catalog=WaterbusDomainTests_MainBaselineAfterEmailOutbox")
          git worktree remove /tmp/waterbus-main --force
          echo "WATERBUS_TEST_MAIN_BASELINE_VALID=$CONN_BASE;Initial Catalog=WaterbusDomainTests_MainBaselineValid" >> "$GITHUB_ENV"
          echo "WATERBUS_TEST_MAIN_BASELINE_DUPLICATE=$CONN_BASE;Initial Catalog=WaterbusDomainTests_MainBaselineDuplicate" >> "$GITHUB_ENV"
          echo "WATERBUS_TEST_MAIN_BASELINE_AFTER_EMAILOUTBOX=$CONN_BASE;Initial Catalog=WaterbusDomainTests_MainBaselineAfterEmailOutbox" >> "$GITHUB_ENV"

      - name: Test
        run: >-
          dotnet test WaterbusSystem.sln --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Email/outbox (unique index, claim đồng thời, lease, MailKit → SMTP catcher) nằm trong bước Test ở trên và được
      # cổng "không bị skip" bên dưới kiểm tra (EmailOutboxSqlTests). Mọi test SQL chạy tuần tự (collection
      # "SQL Server integration", DisableParallelization) để SQL Server 2 core của CI không quá tải.
      # Test bị Skip vẫn tính là "xanh": chặn trường hợp Redis/SQL không được cấu hình mà CI vẫn qua.
      - name: Verify infrastructure tests were executed, not skipped
        run: |
          python3 - <<'PY'
          import re, glob, sys
          text = open(glob.glob("TestResults/**/test-results.trx", recursive=True)[0], encoding="utf-8").read()
          results = re.findall(r'<UnitTestResult[^>]*testName="([^"]+)"[^>]*outcome="([^"]+)"', text)
          gated = ("RedisCommercialTests", "CommercialSqlTests", "DomainPersistenceTests", "EmailOutboxSqlTests",
                   "CheckInConcurrencySqlTests", "ScannerAssignmentMigrationSqlTests", "ScannerDeviceLockSqlTests",
                   "OnboardAudioPlaybackSqlTests")
          bad = [(n, o) for n, o in results if any(g in n for g in gated) and o == "NotExecuted"]
          ran = sum(1 for n, o in results if any(g in n for g in gated) and o == "Passed")
          print(f"infrastructure tests passed: {ran}, not executed: {len(bad)}")
          for n, o in bad: print("  SKIPPED:", n)
          sys.exit(1 if bad or ran == 0 else 0)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: waterbus-be/TestResults
          retention-days: 7

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waterbus-fe
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in waterbus-fe/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: waterbus-fe/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: waterbus-fe/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (tsc + vite)
        run: pnpm build

  docker:
    name: Docker images (build)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API and Web images
        env:
          # Giá trị giả chỉ để compose hợp lệ; không chạy container nào ở bước này
          MSSQL_SA_PASSWORD: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          JWT_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
        run: docker compose build api web
