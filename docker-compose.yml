# ==============================================================================
# Smart Waterbus — toàn bộ hệ thống (SQL Server + Redis + API + Web)
#
#   cp .env.example .env     # điền giá trị thật
#   docker compose up -d --build
#   -> Web: http://localhost:${WEB_PORT:-8080}   (API qua /api, SignalR qua /hubs)
#
# Chỉ cần hạ tầng để chạy API bằng `dotnet run`: docker compose up -d sqlserver redis
# ==============================================================================
name: waterbus

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: waterbus_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Cần đặt MSSQL_SA_PASSWORD trong .env}
      MSSQL_PID: Developer
    ports:
      - "${SQLSERVER_HOST_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: waterbus_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Cần đặt REDIS_PASSWORD trong .env}", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      context: ./waterbus-be
      dockerfile: Dockerfile
    container_name: waterbus_api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # API luôn đứng sau reverse proxy (nginx): lấy IP thật của client từ X-Forwarded-For
      # (rate limit đặt vé tính theo IP) và scheme từ X-Forwarded-Proto. Cổng API không public ra Internet.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=WaterbusDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      ConnectionStrings__RedisConnection: "redis:6379,password=${REDIS_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET:?Cần đặt JWT_SECRET (>= 32 ký tự) trong .env}
      JwtSettings__Issuer: WaterbusSystemApi
      JwtSettings__Audience: WaterbusClients
      Cors__AllowedOrigins__0: ${PUBLIC_URL:-http://localhost:8080}
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__BaseUrl: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__ReturnUrl: ${PUBLIC_URL:-http://localhost:8080}/payment/callback
      Tracking__PersistIntervalSeconds: ${TRACKING_PERSIST_INTERVAL_SECONDS:-15}
      AzureSpeech__SubscriptionKey: ${AZURE_SPEECH_KEY:-}
      AzureSpeech__Region: ${AZURE_SPEECH_REGION:-}
      AzureSpeech__DefaultVoiceName: ${AZURE_SPEECH_VOICE:-}
      AzureSpeech__OutputFormat: ${AZURE_SPEECH_OUTPUT_FORMAT:-Audio16Khz32KBitRateMonoMp3}
      AzureBlobAudioStorage__ConnectionString: ${AZURE_BLOB_CONNECTION_STRING:-}
      AzureBlobAudioStorage__ContainerName: ${AZURE_BLOB_AUDIO_CONTAINER:-audio-guides-private}
      AiBookingAssistant__Groq__ApiKey: ${GROQ_API_KEY:-}
      AiBookingAssistant__Groq__IsEnabled: ${AI_BOOKING_ENABLED:-false}
      AiBookingAssistant__Integration__IsTripSearchContractVerified: ${AI_TRIP_SEARCH_CONTRACT_VERIFIED:-false}
      AiBookingAssistant__Integration__IsBookingLinkContractVerified: ${AI_BOOKING_LINK_CONTRACT_VERIFIED:-false}
      AiBookingAssistant__Integration__BookingUrlTemplate: ${AI_BOOKING_URL_TEMPLATE:-}
      Tracking__Simulator__Enabled: ${TRACKING_SIMULATOR_ENABLED:-false}
      Tracking__Simulator__IntervalSeconds: ${TRACKING_SIMULATOR_INTERVAL_SECONDS:-3}
      Tracking__Simulator__IncludeScheduledTrips: ${TRACKING_SIMULATOR_INCLUDE_SCHEDULED:-false}
      Weather__Enabled: ${WEATHER_ENABLED:-true}
      Weather__Provider: ${WEATHER_PROVIDER:-Fake}
      Weather__ApiKey: ${OPENWEATHERMAP_API_KEY:-}
      Weather__CronExpression: ${WEATHER_CRON:-*/15 * * * *}
      Weather__LookaheadHours: ${WEATHER_LOOKAHEAD_HOURS:-3}
      Weather__WindSpeedThresholdMs: ${WEATHER_WIND_THRESHOLD_MS:-10.6}
      Weather__GustThresholdMs: ${WEATHER_GUST_THRESHOLD_MS:-17.2}
      Weather__Fake__WindSpeedMs: ${WEATHER_FAKE_WIND_MS:-3}
      Weather__Fake__WindGustMs: ${WEATHER_FAKE_GUST_MS:-}
      Weather__Fake__ConditionCode: ${WEATHER_FAKE_CONDITION_CODE:-800}
      Hangfire__Dashboard__Username: ${HANGFIRE_DASHBOARD_USER:-}
      Hangfire__Dashboard__Password: ${HANGFIRE_DASHBOARD_PASSWORD:-}
    ports:
      # Chỉ mở trên máy host (127.0.0.1) để thử API/Swagger; deploy VPS không public cổng này
      - "127.0.0.1:${API_HOST_PORT:-5000}:8080"
    volumes:
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      # Image aspnet không có curl; kiểm tra cổng bằng bash
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks: [backend]

  web:
    build:
      context: ./waterbus-fe
      dockerfile: Dockerfile
      args:
        # Để trống: FE gọi /api cùng origin qua nginx. Chỉ đặt khi API nằm ở domain khác.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: waterbus_web
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    networks: [backend]

volumes:
  sqlserver_data:
  redis_data:
  dataprotection_keys:

networks:
  backend:
